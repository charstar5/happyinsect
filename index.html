<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>creative caterpillar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fffdf7;
    --ink: #3b3b3b;
    --on-fill: #2f2f2f;
    --sky: #7cc6ea;          /* left border: "some sort of sky blue" */
    --green: #a8dd98;        /* header bar: "green" */
    --leaf: #4f9a4a;
    --seg: #6fc35f;
    --orange: #ffc78a;       /* title pill: "pale orange" (needs confirming) */
    --pencil: #ffe27a;       /* "some colour I forgot" (placeholder yellow) */
    --muted: #6b6b6b;
    --wobble: 14px 4px 12px 5px / 5px 12px 4px 14px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1c2231;
      --ink: #ebe7de;
      --green: #2f5a3a;
      --leaf: #7ccf6e;
      --muted: #a9a79f;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1c2231;
    --ink: #ebe7de;
    --green: #2f5a3a;
    --leaf: #7ccf6e;
    --muted: #a9a79f;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Patrick Hand", "Comic Sans MS", "Chalkboard SE", cursive;
    font-size: 1.15rem;
    line-height: 1.4;
    border-left: clamp(16px, 3.4vw, 36px) solid var(--sky);
  }
  a { color: inherit; text-decoration: none; }
  a:focus-visible, button:focus-visible, input:focus-visible + span {
    outline: 3px dashed var(--ink);
    outline-offset: 3px;
  }

  /* Header */
  .top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem 1.5rem;
    padding: 0.9rem 1.25rem;
    background: var(--green);
    border-bottom: 3px solid var(--ink);
  }
  .vine { width: 150px; height: 50px; flex: none; }
  .vine path { fill: none; stroke: var(--leaf); stroke-width: 3; stroke-linecap: round; }
  .vine ellipse { fill: var(--leaf); }
  .brand {
    background: var(--orange);
    color: var(--on-fill);
    border: 2.5px solid var(--on-fill);
    border-radius: 999px;
    padding: 0.15rem 1.6rem 0.3rem;
  }
  .brand h1 {
    margin: 0;
    font-weight: 400;
    font-size: clamp(1.9rem, 4.5vw, 2.7rem);
    line-height: 1.15;
    white-space: nowrap;
  }
  .shades { display: inline-block; width: 1.5em; height: 0.7em; vertical-align: -0.02em; margin: 0 0.04em; }

  .crawl { display: flex; align-items: flex-end; flex: none; }
  .seg {
    display: grid;
    place-items: center;
    width: 29px;
    height: 29px;
    margin-left: -4px;
    border: 2.5px solid var(--on-fill);
    border-radius: 50%;
    background: var(--seg);
    color: var(--on-fill);
    font-size: 1rem;
    line-height: 1;
    animation: inch 0.7s ease-in-out both;
    animation-delay: calc(var(--i) * 70ms);
  }
  .seg:nth-child(even) { margin-top: 5px; }
  .seg.gap { margin-left: 6px; }
  .head { width: 46px; height: 46px; margin-left: -6px; }
  .egg { width: 38px; height: 50px; margin-left: 8px; }
  .head circle.skin { fill: var(--seg); }
  .head path, .head line, .head circle.eye, .egg path, .egg ellipse { stroke: var(--on-fill); }
  .head line, .head path { stroke-width: 2.5; fill: none; stroke-linecap: round; }
  .head circle.eye { fill: #fff; stroke-width: 2; }
  .head circle.dot { fill: var(--on-fill); }
  .egg ellipse { fill: #fff6d6; stroke-width: 2.5; }
  .egg path { fill: none; stroke-width: 2; stroke-linejoin: round; }
  @keyframes inch {
    0%, 100% { transform: translateY(0); }
    45% { transform: translateY(-7px); }
  }
  @media (prefers-reduced-motion: reduce) { .seg { animation: none; } }

  /* Layout */
  .site {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 220px;
    gap: 1.5rem 2rem;
    padding: 1.75rem 1.5rem 3rem;
    max-width: 1200px;
  }
  .tiles {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-areas:
      "outside inside photo activity"
      "draw    draw   .     question";
    gap: 1.75rem 1.25rem;
    align-items: start;
  }
  .t-outside { grid-area: outside; }
  .t-inside { grid-area: inside; }
  .t-photo { grid-area: photo; }
  .t-activity { grid-area: activity; }
  .t-draw { grid-area: draw; }
  .t-question { grid-area: question; }

  /* Books */
  .book {
    display: flex;
    filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.12));
  }
  .page {
    flex: 1;
    min-height: 140px;
    padding: 0.7rem 0.55rem;
    background: #fff;
    color: var(--on-fill);
    border: 2.5px solid var(--on-fill);
    text-align: center;
    font-size: 1.1rem;
    line-height: 1.25;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .page.l { border-radius: 8px 0 0 8px; transform: skewY(4deg); transform-origin: right center; }
  .page.r { border-radius: 0 8px 8px 0; border-left-width: 1.5px; transform: skewY(-4deg); transform-origin: left center; }
  .page b { font-weight: 400; font-size: 1.9rem; line-height: 1; letter-spacing: 0.04em; }
  .book:hover .page { background: #fff6d6; }

  /* Photo */
  .photo { margin: 0; }
  .photo img {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
    aspect-ratio: 10 / 7;
    object-fit: cover;
    background: #fff;
    border: 2.5px solid var(--ink);
    border-radius: var(--wobble);
  }

  /* Bubbles */
  .bubble {
    padding: 1rem 1.1rem 1.1rem;
    border: 2.5px solid var(--ink);
    border-radius: 2rem / 1.5rem;
    text-align: center;
  }
  .bubble h2 { margin: 0 0 0.3rem; font-weight: 400; font-size: 1.35rem; line-height: 1.15; }
  .bubble p { margin: 0; font-size: 1.05rem; color: var(--muted); }

  /* Pencil */
  .pencil {
    display: inline-grid;
    width: 250px;
    max-width: 100%;
  }
  .pencil > * { grid-area: 1 / 1; }
  .pencil svg { width: 100%; height: auto; display: block; }
  .pencil .body { fill: var(--pencil); }
  .pencil .tip { fill: #f1d6ad; }
  .pencil .lead { fill: var(--ink); }
  .pencil path, .pencil rect, .pencil polygon { stroke: var(--on-fill); stroke-width: 2.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .pencil span {
    align-self: center;
    padding-left: 1.2rem;
    padding-right: 3.4rem;
    color: var(--on-fill);
    font-size: 1.5rem;
  }

  /* Donations */
  .donate { text-align: center; }
  .donate a {
    display: inline-block;
    padding: 0.2rem 1.6rem 0.3rem;
    border: 2.5px solid var(--ink);
    border-radius: 999px;
    font-size: 1.5rem;
  }
  .donate a:hover { background: var(--orange); color: var(--on-fill); }
  .donate p { margin: 0.8rem 0 0; text-align: left; font-size: 1.05rem; }

  /* List and placeholder views */
  .view-inner { max-width: 44rem; padding: 1.75rem 1.5rem 3rem; }
  .back { display: inline-block; margin-bottom: 1rem; border-bottom: 2px solid var(--ink); }
  .view-inner h2 { margin: 0 0 0.25rem; font-weight: 400; font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1.15; }
  .sub { margin: 0 0 1.25rem; color: var(--muted); }
  .ideas { margin: 0; padding: 0; list-style: none; counter-reset: idea; }
  .ideas li { counter-increment: idea; border-bottom: 2px dashed var(--muted); }
  .ideas label { display: flex; gap: 0.75rem; align-items: flex-start; padding: 0.7rem 0; cursor: pointer; }
  .ideas label::before { content: counter(idea) "."; min-width: 1.8rem; text-align: right; color: var(--muted); }
  .ideas input { position: absolute; opacity: 0; }
  .ideas input + span {
    flex: none;
    order: 2;
    width: 1.5rem; height: 1.5rem; margin-top: 0.1rem;
    border: 2.5px solid var(--ink);
    border-radius: 6px 3px 6px 3px;
  }
  .ideas .text { order: 1; flex: 1; }
  .ideas input:checked + span { background: var(--seg); box-shadow: inset 0 0 0 2px var(--paper); }
  .ideas input:checked ~ .text { text-decoration: line-through; color: var(--muted); }
  [hidden] { display: none !important; }

  /* Narrower screens */
  @media (max-width: 880px) {
    .site { grid-template-columns: minmax(0, 1fr); }
    .donate { max-width: 22rem; }
  }
  @media (max-width: 720px) {
    .tiles {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-areas:
        "outside inside"
        "photo   photo"
        "activity question"
        "draw    draw";
    }
    .top { justify-content: center; }
    .vine { display: none; }
  }
  @media (max-width: 440px) {
    .tiles {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "outside" "inside" "photo" "activity" "question" "draw";
    }
    .crawl { transform: scale(0.85); transform-origin: center; }
  }
</style>
</head>
<body>

<header class="top">
  <svg class="vine" viewBox="0 0 160 50" aria-hidden="true">
    <path d="M3 30 C30 8 52 46 82 28 S132 10 157 26"/>
    <ellipse cx="22" cy="15" rx="9" ry="4.5" transform="rotate(-40 22 15)"/>
    <ellipse cx="44" cy="40" rx="9" ry="4.5" transform="rotate(35 44 40)"/>
    <ellipse cx="72" cy="20" rx="9" ry="4.5" transform="rotate(-35 72 20)"/>
    <ellipse cx="100" cy="38" rx="9" ry="4.5" transform="rotate(30 100 38)"/>
    <ellipse cx="128" cy="14" rx="9" ry="4.5" transform="rotate(-40 128 14)"/>
  </svg>

  <a class="brand" href="#" aria-label="Creative Caterpillar, home">
    <h1>Creative
        <path d="M2 4 H62" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <path d="M4 5 H29 V15 C29 21 24 26 16.5 26 C9 26 4 21 4 15 Z" fill="currentColor"/>
        <path d="M35 5 H60 V15 C60 21 55 26 47.5 26 C40 26 35 21 35 15 Z" fill="currentColor"/>
        <path d="M9 11 L15 8 M40 11 L46 8" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
      </svg> Caterpillar</h1>
  </a>

  <div class="crawl" id="crawl" role="img" aria-label="Get creative. A caterpillar made of letters crawls toward an egg.">
    <!-- letter segments are added by the script below -->
    <svg class="head" viewBox="0 0 50 50" aria-hidden="true">
      <line x1="19" y1="14" x2="13" y2="4"/><line x1="33" y1="14" x2="39" y2="4"/>
      <circle class="dot" cx="13" cy="4" r="2.5"/><circle class="dot" cx="39" cy="4" r="2.5"/>
      <circle class="skin" cx="26" cy="29" r="17" stroke="var(--on-fill)" stroke-width="2.5"/>
      <circle class="eye" cx="20" cy="26" r="4"/><circle class="eye" cx="32" cy="26" r="4"/>
      <circle class="dot" cx="21" cy="26" r="1.8"/><circle class="dot" cx="33" cy="26" r="1.8"/>
      <path d="M20 36 Q26 41 32 36"/>
    </svg>
    <svg class="egg" viewBox="0 0 40 52" aria-hidden="true">
      <ellipse cx="20" cy="30" rx="16" ry="20"/>
      <path d="M6 22 l4 -4 4 4 4 -4 4 4 4 -4 4 4 4 -4 4 4"/>
      <path d="M5 33 l4 -4 4 4 4 -4 4 4 4 -4 4 4 4 -4 4 4"/>
      <path d="M8 43 l4 -4 4 4 4 -4 4 4 4 -4 4 4"/>
    </svg>
  </div>
</header>

<!-- HOME -->
<main id="view-home" class="site" tabindex="-1">
  <div class="tiles">
    <a class="book t-outside" href="#outside" aria-label="1000 creative things to do outside">
      <span class="page l"><b>1000</b>creative things</span>
      <span class="page r">to do<br>outside</span>
    </a>

    <a class="book t-inside" href="#inside" aria-label="1000 creative things to do inside">
      <span class="page l"><b>1000</b>creative things</span>
      <span class="page r">to do<br>inside</span>
    </a>

    <!-- Uploads will replace this placeholder image later. Swap the src (or this whole figure) when that is hooked up. -->
    <figure class="photo t-photo">
      <img id="featured-photo" alt="Placeholder for a photo that will be uploaded"
        src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 140'%3E%3Cg fill='none' stroke='%23888' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M20 40h40l8-14h32l8 14h72v84H20z'/%3E%3Ccircle cx='100' cy='82' r='30'/%3E%3C/g%3E%3Ctext x='100' y='95' text-anchor='middle' font-size='38' font-family='sans-serif' fill='%23888'%3E%3F%3C/text%3E%3C/svg%3E">
    </figure>

    <div class="bubble t-activity">
      <h2>Activity of the week</h2>
      <p id="activity-text"></p>
    </div>

    <a class="pencil t-draw" href="#draw">
      <svg viewBox="0 0 250 64" aria-hidden="true">
        <rect class="body" x="2" y="2" width="196" height="60" rx="3"/>
        <polygon class="tip" points="198,2 198,62 246,32"/>
        <polygon class="lead" points="230,23 230,41 246,32"/>
        <path d="M168 2 V62" fill="none"/>
      </svg>
      <span>How to draw</span>
    </a>

    <div class="bubble t-question">
      <h2>Question of the week</h2>
      <p id="question-text"></p>
    </div>
  </div>

  <aside class="donate">
    <a href="#donations">donations</a>
    <p>Hey kids! Could you ask your parents to donate a bit of money? It's kinda hard paying for the website.</p>
  </aside>
</main>

<!-- LIST PAGES -->
<section id="view-list" class="view-inner" tabindex="-1" hidden>
  <a class="back" href="#">Back to home</a>
  <h2 id="list-title"></h2>
  <p class="sub" id="list-sub"></p>
  <ol class="ideas" id="ideas"></ol>
</section>

<!-- PLACEHOLDER PAGES -->
<section id="view-soon" class="view-inner" tabindex="-1" hidden>
  <a class="back" href="#">Back to home</a>
  <h2 id="soon-title"></h2>
  <p class="sub" id="soon-text"></p>
</section>

<script>
  // ---------- Content to edit ----------
  var WEEKLY = {
    activity: "Build a creature out of things from the recycling bin and give it a name.",
    question: "If you could invent a brand new colour, what would you call it?"
  };

  var LISTS = {
    outside: {
      title: "1000 creative things to do outside",
      items: [
        "Build a fairy house from sticks, leaves and bark.",
        "Draw a giant map of an imaginary island on the path with chalk.",
        "Place a crayon and paper on a leaf and rub to make a leaf print.",
        "Trace your shadow with chalk, then trace it again an hour later.",
        "Make a bracelet from a loop of tape, sticky side out, and collect petals and leaves on it.",
        "Build a bug hotel from pinecones, bamboo and old bricks.",
        "Paint a smooth rock and hide it for someone to find.",
        "Invent an obstacle course and time your family on it.",
        "Spend ten minutes cloud watching, then tell a story about what you saw.",
        "Make a boat from a leaf and a twig and sail it across a puddle.",
        "Make a mud kitchen and write a menu for it.",
        "Write a message in stones or sticks that an aeroplane could read."
      ]
    },
    inside: {
      title: "1000 creative things to do inside",
      items: [
        "Build a blanket fort with a secret entrance.",
        "Draw a comic about what your pet does when you are not home.",
        "Fold paper aeroplanes and hold a distance contest.",
        "Invent a board game from cardboard and bottle caps.",
        "Turn a shoebox into a tiny scene from a favourite story.",
        "Draw a picture using your other hand.",
        "Draw a treasure map of your house, hide something and let someone follow it.",
        "Build the tallest tower you can from newspaper and tape.",
        "Put on a puppet show with socks.",
        "Invent a secret code and write a message in it.",
        "Learn to fold an origami frog.",
        "Make a musical instrument from a tin, a rubber band and a ruler."
      ]
    }
  };

  var SOON = {
    draw: { title: "How to draw", text: "Step by step drawing lessons are coming soon." },
    donations: { title: "Donations", text: "A way to donate is coming soon. Thank you for wanting to help." }
  };

  // ---------- Caterpillar ----------
  (function () {
    var crawl = document.getElementById("crawl");
    var head = crawl.querySelector(".head");
    var letters = "GetCreative".split("");
    letters.forEach(function (ch, i) {
      var s = document.createElement("span");
      s.className = "seg" + (i === 3 ? " gap" : "");
      s.style.setProperty("--i", i);
      s.setAttribute("aria-hidden", "true");
      s.textContent = ch;
      crawl.insertBefore(s, head);
    });
  })();

  document.getElementById("activity-text").textContent = WEEKLY.activity;
  document.getElementById("question-text").textContent = WEEKLY.question;

  // ---------- Remembering ticks (per browser) ----------
  function loadDone(key) {
    try { return JSON.parse(localStorage.getItem("cc-done-" + key) || "[]"); }
    catch (e) { return []; }
  }
  function saveDone(key, arr) {
    try { localStorage.setItem("cc-done-" + key, JSON.stringify(arr)); }
    catch (e) { /* storage unavailable, ticks last for this visit only */ }
  }

  // ---------- Simple page switching ----------
  var views = {
    home: document.getElementById("view-home"),
    list: document.getElementById("view-list"),
    soon: document.getElementById("view-soon")
  };

  function showList(key) {
    var data = LISTS[key];
    var done = loadDone(key);
    document.getElementById("list-title").textContent = data.title;
    var sub = document.getElementById("list-sub");
    var ol = document.getElementById("ideas");
    ol.innerHTML = "";
    function updateCount() {
      sub.textContent = "Tick the ones you have done. " + done.length + " of " + data.items.length + " done so far.";
    }
    data.items.forEach(function (text, i) {
      var li = document.createElement("li");
      var label = document.createElement("label");
      var input = document.createElement("input");
      input.type = "checkbox";
      input.checked = done.indexOf(i) !== -1;
      input.addEventListener("change", function () {
        done = done.filter(function (n) { return n !== i; });
        if (input.checked) done.push(i);
        saveDone(key, done);
        updateCount();
      });
      var box = document.createElement("span");
      var t = document.createElement("span");
      t.className = "text";
      t.textContent = text;
      label.appendChild(input);
      label.appendChild(box);
      label.appendChild(t);
      li.appendChild(label);
      ol.appendChild(li);
    });
    updateCount();
  }

  function route() {
    var r = (location.hash || "").replace("#", "");
    var current = "home";
    var title = "Cool Caterpillar";
    if (LISTS[r]) {
      current = "list";
      showList(r);
      title = LISTS[r].title + " | Cool Caterpillar";
    } else if (SOON[r]) {
      current = "soon";
      document.getElementById("soon-title").textContent = SOON[r].title;
      document.getElementById("soon-text").textContent = SOON[r].text;
      title = SOON[r].title + " | Cool Caterpillar";
    }
    Object.keys(views).forEach(function (k) { views[k].hidden = (k !== current); });
    document.title = title;
    window.scrollTo(0, 0);
    if (r) views[current].focus({ preventScroll: true });
  }
  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
